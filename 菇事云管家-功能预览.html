<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>菇事云管家 - 功能预览</title>
  <style>
    :root {
      --green-900: #174f39;
      --green-800: #1f6a4a;
      --green-700: #27845a;
      --cream: #f6f8f4;
      --ink: #17291f;
      --muted: #66756b;
      --line: #dbe7de;
    }
    * { box-sizing: border-box; }
    html { background: #eaf0e8; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(156, 203, 75, .18), transparent 24%),
        radial-gradient(circle at 88% 92%, rgba(56, 161, 105, .15), transparent 26%),
        #eaf0e8;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    .page-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 15px 24px;
      color: #fff;
      background: rgba(31, 106, 74, .96);
      border-bottom: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 10px 30px rgba(23, 79, 57, .16);
      backdrop-filter: blur(16px);
    }
    .page-header-inner {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
    }
    .page-header p {
      margin: 4px 0 0;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
    }
    .readonly-badge {
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    main {
      width: min(1080px, calc(100% - 28px));
      margin: 24px auto 48px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      align-items: start;
    }
    .screen-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(25, 70, 49, .08);
    }
    .screen-frame {
      display: grid;
      place-items: center;
      min-height: 430px;
      padding: 12px;
      background: var(--cream);
      border-bottom: 1px solid #edf2ee;
    }
    .screen-frame img {
      display: block;
      width: 100%;
      max-width: 504px;
      height: auto;
      border: 1px solid #e3ebe5;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(23, 79, 57, .1);
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .screen-copy { padding: 15px 17px 17px; }
    .screen-copy h2 {
      margin: 0;
      color: var(--green-900);
      font-size: 17px;
    }
    .screen-copy p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    @media (max-width: 640px) {
      .page-header { padding: 13px 16px; }
      .page-header-inner { align-items: flex-start; }
      .page-header h1 { font-size: 18px; }
      .readonly-badge { font-size: 11px; }
      main {
        width: min(100% - 20px, 520px);
        margin-top: 14px;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .screen-frame { min-height: 0; padding: 8px; }
      .screen-frame img { border-radius: 10px; }
    }
  </style>
</head>
