.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:9px;color:var(--muted);font-weight:800;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe9e2;border-radius:12px;padding:10px 11px;background:#fafcfa;outline:0;font-size:11px;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g600);box-shadow:0 0 0 3px rgba(56,161,105,.1)}.sheet{max-height:88%;overflow:auto}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions button{flex:1}.secondary{height:43px;border:1px solid var(--line);border-radius:14px;background:#f5f8f6;color:#53685c;font-size:12px;font-weight:800}.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0}.toolbar .search{flex:1}.toolbar .primary{width:auto;padding:0 14px;margin:0}.empty{padding:34px 18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #dbe6de;border-radius:18px;font-size:10px;line-height:1.8}.empty b{display:block;color:var(--ink);font-size:13px;margin-bottom:6px}.list-card{padding:14px;margin-bottom:10px}.row-top{display:flex;justify-content:space-between;gap:10px}.row-top h3{font-size:12px;margin:0}.row-top p{font-size:9px;color:var(--muted);margin:5px 0 0;line-height:1.5}.badge{font-size:8px;padding:5px 7px;border-radius:99px;background:var(--g100);color:var(--g800);white-space:nowrap;font-weight:800}.badge.warn{background:#fff0d8;color:#a9691a}.badge.red{background:#ffeded;color:#b94242}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:8px;color:#87958d}.metric-line{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.metric-line div{background:#f7faf7;border-radius:11px;padding:8px}.metric-line span{display:block;font-size:8px;color:var(--muted)}.metric-line b{display:block;font-size:11px;margin-top:4px}.action-row{display:flex;gap:8px;margin-top:11px}.action-row button{flex:1;border:0;border-radius:11px;padding:9px;background:var(--g100);color:var(--g800);font-size:9px;font-weight:800}.action-row button.plain{background:#f2f5f3;color:#5e7065}.loading{padding:50px 20px;text-align:center;color:var(--muted);font-size:10px}.error{padding:24px 18px;border-radius:18px;background:#fff0f0;color:#a33f3f;font-size:10px;line-height:1.7}.notice{padding:11px 12px;border-radius:13px;background:#fff8e9;border:1px solid #f3dfb9;color:#8f6421;font-size:9px;line-height:1.6;margin-bottom:10px}.success{background:#edf7f0;border-color:#d4e8d9;color:#31704b}.inline-select{height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 9px;font-size:10px;color:var(--ink)}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}

<body>
<div class="phone">
  <div class="statusbar"><span id="clock">09:41</span><span class="status-icons">●●● ▮</span></div>
  <header class="navbar">
    <div class="nav-left"><div class="nav-logo"><img src="/assets/logo-source.jpg" alt="菇事云管家"></div><div><div class="nav-title" id="navTitle">菇事云管家</div><div class="nav-sub" id="navSub">真实业务数据管理</div></div></div>
    <div class="nav-actions"><button class="nav-action" id="accountButton" aria-label="当前账号">👤</button><button class="nav-action" id="addButton" aria-label="新增数据">＋</button></div>
  </header>
  <main id="app"><div class="loading">正在连接后台并读取数据...</div></main>
  <nav class="tabbar">
    <button class="active" data-page="home"><i>⌂</i><span>首页</span></button>
    <button data-page="production"><i>▤</i><span>生产</span></button>
    <button data-page="monitor"><i>◉</i><span>监测</span></button>
    <button data-page="trace"><i>⌕</i><span>溯源</span></button>
    <button data-page="market"><i>🛒</i><span>市场</span></button>
  </nav>
  <div class="sheet-mask" id="sheetMask">
    <div class="sheet">
      <h3 id="sheetTitle">新增数据</h3>
      <p id="sheetDesc">保存后会写入后台数据库，并立即刷新页面。</p>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div class="toast" id="toast">已完成</div>
</div>
<script>
const state={page:'home',loading:true,error:'',token:localStorage.getItem('gushi_token')||'',user:JSON.parse(localStorage.getItem('gushi_user')||'null'),data:{dashboard:null,bases:[],batches:[],readings:[],alerts:[],questions:[],products:[],demands:[],tasks:[]}};
const $=(selector,root=document)=>root.querySelector(selector);
const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const num=value=>Number(value||0);
const money=value=>num(value).toFixed(2).replace(/\.00$/,'');
const dateOnly=value=>value?String(value).slice(0,10):'';
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const today=()=>new Date().toISOString().slice(0,10);
async function api(path,options={}){
  const headers={'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})};
  const response=await fetch(path,{headers,...options});
  let payload;
  try{payload=await response.json()}catch{throw new Error('后台返回格式错误')}
  // 未登录或登录过期：回到登录页，不展示任何编造数据
  if(response.status===401){clearAuth();renderLogin();throw new Error(payload.message||'请先登录账号')}
  if(!response.ok||payload.code!==0)throw new Error(payload.message||`请求失败：${response.status}`);
  return payload.data;
}
async function loadAll(){
  state.loading=true;state.error='';render();
  try{
    const [dashboard,bases,batches,readings,alerts,questions,products,demands,tasks]=await Promise.all([
      api('/api/dashboard'),api('/api/bases'),api('/api/batches'),api('/api/readings?limit=100'),api('/api/alerts?limit=100'),api('/api/questions'),api('/api/products'),api('/api/demands'),api('/api/tasks')
    ]);
    state.data={dashboard,bases,batches,readings,alerts,questions,products,demands,tasks};
  }catch(error){state.error=error.message}
  state.loading=false;render();
}
function toast(message,error=false){

function fieldHtml(field){
 const required=field.required?'required':'';
 const full=field.full?'full':'';
 const value=field.value??'';
 if(field.type==='textarea')return `<div class="field ${full}"><label>${esc(field.label)}</label><textarea name="${field.name}" ${required}>${esc(value)}</textarea></div>`;
 if(field.type==='select')return `<div class="field ${full}"><label>${esc(field.label)}</label><select name="${field.name}" ${required}>${field.options?field.options():''}</select></div>`;
 if(field.type==='file')return `<div class="field ${full}"><label>${esc(field.label)}</label><input type="file" name="${field.name}" accept="image/jpeg,image/png,image/webp,image/gif"></div>`;
 return `<div class="field ${full}"><label>${esc(field.label)}</label><input type="${field.type||'text'}" name="${field.name}" value="${esc(value)}" ${field.step?`step="${field.step}"`:''} ${required}></div>`;
}

function closeSheet(){$('#sheetMask').classList.remove('open')}
function go(page){if(!state.token){toast('请先登录账号',true);renderLogin();return}state.page=page;closeSheet();render();$('#app').scrollTop=0}
function uploadImage(file){return new Promise((resolve,reject)=>{if(file.size>4*1024*1024)return reject(new Error('图片不能超过 4MB'));const reader=new FileReader();reader.onerror=()=>reject(new Error('图片读取失败'));reader.onload=async()=>{try{const result=await api('/api/uploads',{method:'POST',body:JSON.stringify({data:reader.result})});resolve(result.url)}catch(error){reject(error)}};reader.readAsDataURL(file)})}
function iconHtml(icon,alt='产品图标'){return icon?(icon.startsWith('http')||icon.startsWith('/')?`<img src="${esc(icon)}" alt="${esc(alt)}">`:esc(icon)):'🍄'}
function openIconEditor(id){const product=state.data.products.find(item=>item.id===Number(id));if(!product)return;const presets=['🍄','🌿','🌱','🥬','🫘','🍲','📦','🏷️'];let selected=product.icon||'🍄';$('#sheetTitle').textContent='更换产品图标';$('#sheetDesc').textContent='选择预设图标，或上传自己的图片，保存后写入后台。';$('#sheetBody').innerHTML=`<div class="icon-preview" id="iconPreview">${iconHtml(selected,product.name)}</div><div class="preset-icons">${presets.map(icon=>`<button type="button" data-icon-choice="${icon}" class="${icon===selected?'active':''}">${icon}</button>`).join('')}</div><div class="field" style="margin-top:14px"><label>上传图片</label><input id="iconFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div class="sheet-actions"><button type="button" class="secondary" data-close-sheet>取消</button><button type="button" class="primary" id="saveIcon">保存图标</button></div>`;$('#sheetMask').classList.add('open');$$('[data-icon-choice]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.iconChoice;$$('[data-icon-choice]').forEach(item=>item.classList.toggle('active',item===button));$('#iconPreview').innerHTML=iconHtml(selected,product.name)}));$('#iconFile').addEventListener('change',event=>{const file=event.target.files?.[0];if(file){const url=URL.createObjectURL(file);$('#iconPreview').innerHTML=`<img src="${url}" alt="预览">`}});$('#saveIcon').addEventListener('click',async()=>{const button=$('#saveIcon');button.disabled=true;button.textContent='保存中...';try{const file=$('#iconFile').files?.[0];const icon=file?await uploadImage(file):selected;await api(`/api/products/${product.id}`,{method:'PUT',body:JSON.stringify({icon})});closeSheet();toast('产品图标已更新');await loadAll()}catch(error){toast(error.message,true);button.disabled=false;button.textContent='保存图标'}})}
document.addEventListener('click',async event=>{
 const pageButton=event.target.closest('[data-page]');if(pageButton){go(pageButton.dataset.page);return}
 const formButton=event.target.closest('[data-form]');if(formButton){openSheet(formButton.dataset.form);return}
 const iconButton=event.target.closest('[data-edit-icon]');if(iconButton){openIconEditor(iconButton.dataset.editIcon);return}
 if(event.target.closest('[data-close-sheet]')||event.target===$('#sheetMask')){closeSheet();return}
 const ack=event.target.closest('[data-ack]');if(ack){try{await api(`/api/alerts/${ack.dataset.ack}/ack`,{method:'POST',body:'{}'});toast('预警已处理');await loadAll()}catch(error){toast(error.message,true)}return}
 const search=event.target.closest('[data-trace-search]');if(search){const code=$('#traceCode').value.trim();if(!code){toast('请输入批次编号',true);return}try{state.traceCode=code;state.traceResult=await api(`/api/trace/${encodeURIComponent(code)}`);render();toast('查询成功')}catch(error){state.traceResult=null;render();toast(error.message,true)}return}
});
$('#addButton').addEventListener('click',()=>openSheet('menu'));
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})},1000);$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
/* ---------- 账号：登录 / 注册 / 退出 ---------- */
function saveAuth(data){state.token=data.token;state.user=data.user;localStorage.setItem('gushi_token',data.token);localStorage.setItem('gushi_user',JSON.stringify(data.user))}
function clearAuth(){state.token='';state.user=null;localStorage.removeItem('gushi_token');localStorage.removeItem('gushi_user')}
function renderLogin(mode='login'){
  state.page='login';
  $('#navTitle').textContent=mode==='login'?'账号登录':'注册账号';
  $('#navSub').textContent='每个账号的数据独立保存';
  $('#app').innerHTML=`<section class="page active">
  <div class="hero" style="min-height:auto"><small>GU SHI CLOUD · 数据可保存</small><h1>登录后<em>数据只属于你的账号</em></h1><p>基地、批次、环境、溯源、供应和采购记录都保存在后台数据库，服务重启不会丢失，其他账号看不到。</p></div>
  <div class="card" style="padding:16px;margin-top:14px">
    <div style="font-size:15px;font-weight:900">${mode==='login'?'账号登录':'注册新账号'}</div>
    <p style="font-size:9px;color:var(--muted);margin:6px 0 14px">${mode==='login'?'还没有账号？点击下方“注册新账号”。':'注册成功后自动登录，数据只保存在这个账号下。'}</p>
    <form id="authForm" class="form-grid">
      <div class="field full"><label>账号</label><input name="username" autocomplete="username" placeholder="3-32 位字母、数字、下划线或中文"></div>
      <div class="field full"><label>密码</label><input type="password" name="password" autocomplete="current-password" placeholder="至少 6 位"></div>
      ${mode==='register'?'<div class="field full"><label>称呼（可选）</label><input name="display_name" placeholder="例如：王师傅 / 德安基地"></div>':''}
    </form>
    <button class="primary full" id="authSubmit">${mode==='login'?'登录':'注册并登录'}</button>
    <div class="sheet-actions"><button class="secondary" id="authSwitch">${mode==='login'?'注册新账号':'返回登录'}</button></div>
  </div></section>`;
  $('#authSwitch').addEventListener('click',()=>renderLogin(mode==='login'?'register':'login'));
  $('#authSubmit').addEventListener('click',async()=>{
    const payload=Object.fromEntries(new FormData($('#authForm')).entries());
    if(!payload.username||!payload.password){toast('请填写账号和密码',true);return}
    const button=$('#authSubmit');button.disabled=true;button.textContent='提交中...';
    try{
      const data=await api(mode==='login'?'/api/auth/login':'/api/auth/register',{method:'POST',body:JSON.stringify(payload)});
      saveAuth(data);toast(mode==='login'?'登录成功':'注册成功');await loadAll();
    }catch(error){toast(error.message,true);button.disabled=false;button.textContent=mode==='login'?'登录':'注册并登录'}
  });
}
function openAccount(){
  $('#sheetTitle').textContent='当前账号';
  $('#sheetDesc').textContent=state.user?`${state.user.display_name||state.user.username}（${state.user.username}）`:'未登录';
  $('#sheetBody').innerHTML=`<div class="notice success">该账号的基地、批次、环境、溯源、供应和采购记录都保存在后台 SQLite 数据库（server/data/gushi.sqlite），服务重启不会丢失，其他账号看不到。</div><div class="sheet-actions"><button class="secondary" data-close-sheet>关闭</button><button class="primary" data-logout>退出登录</button></div>`;
  $('#sheetMask').classList.add('open');
}
document.addEventListener('click',async event=>{
  if(event.target.closest('#accountButton')){openAccount();return}
  if(event.target.closest('[data-logout]')){
    try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch(error){}
    clearAuth();closeSheet();renderLogin();toast('已退出登录');
  }
});
if(state.token){loadAll()}else{renderLogin()}
</script>
</body>
</html>
