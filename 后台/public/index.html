async function api(path,options={}){
  const headers={'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})};
  const response=await fetch(path,{headers,...options});

  try{payload=await response.json()}catch{throw new Error('后台返回格式错误')}

  if(response.status===401){clearAuth();renderLogin();throw new Error(payload.message||'请先登录账号')}

  return payload.data;
}

/* 下拉框：把当前值标记为 selected，「修改」时能带出原来的选择 */
function selectHtml(field,value){
 const html=field.options?field.options():'';
 const v=value===null||value===undefined||value===''?'':String(value);
 if(!v)return html;
 const quoted=`value="${esc(v)}"`;
 if(html.includes(quoted))return html.replace(quoted,`${quoted} selected`);
 const plain=`<option>${esc(v)}</option>`;
 if(html.includes(plain))return html.replace(plain,`<option selected>${esc(v)}</option>`);
 return html;
}
function fieldHtml(field){
 const required=field.required?'required':'';
 const full=field.full?'full':'';
 const value=field.value??'';
 if(field.type==='textarea')return `<div class="field ${full}"><label>${esc(field.label)}</label><textarea name="${field.name}" ${required}>${esc(value)}</textarea></div>`;
 if(field.type==='select')return `<div class="field ${full}"><label>${esc(field.label)}</label><select name="${field.name}" ${required}>${selectHtml(field,value)}</select></div>`;
 if(field.type==='file')return `<div class="field ${full}"><label>${esc(field.label)}</label><input type="file" name="${field.name}" accept="image/jpeg,image/png,image/webp,image/gif"></div>`;
 return `<div class="field ${full}"><label>${esc(field.label)}</label><input type="${field.type||'text'}" name="${field.name}" value="${esc(value)}" ${field.step?`step="${field.step}"`:''} ${required}></div>`;
}
/* 修改回显：日期只保留年月日，避免 date 输入框不认带时间的字符串 */
function recordFieldValue(field,record){
 const raw=record[field.name];
 if(raw===null||raw===undefined)return field.value??'';
 if(field.type==='date')return dateOnly(raw);
 if(field.type==='datetime-local')return String(raw).slice(0,16);
 return String(raw);
}
/* record 存在时是「修改」：带出原内容，保存走 PUT 覆盖原记录；否则是新增 */
function openSheet(type,record){
 const config=formConfigs[type];
 const sheetBody=$('#sheetBody');
 const editing=!!record;
 if(type==='menu'){
  $('#sheetTitle').textContent='新增数据';$('#sheetDesc').textContent='选择要保存到后台数据库的记录类型';
  sheetBody.innerHTML=`<div class="form-grid">${menuTypes.map(([key,label])=>`<button class="secondary" data-form="${key}">${label}</button>`).join('')}</div><div class="sheet-actions"><button class="secondary" data-close-sheet>取消</button></div>`;
 }else if(config){
  if(['batch','reading'].includes(type)&&!state.data.bases.length){toast('请先新增基地',true);return}
  if(['trace-event','product'].includes(type)&&!state.data.batches.length){toast('请先新增生产批次',true);return}
  $('#sheetTitle').textContent=editing?(config.editTitle||'修改'+config.title):config.title;
  $('#sheetDesc').textContent=editing?'带出原来的内容，保存后会覆盖原记录。':config.desc;
  const fields=config.fields.map(field=>{
   if(!editing)return field;
   const next={...field,value:recordFieldValue(field,record)};
   // 供应信息里的图标：留空表示保持原图标，避免上传过的图片被预设图标覆盖
   if(field.name==='icon')next.options=()=>'<option value="">保持原图标不变</option>'+(field.options?field.options():'');
   return next;
  });
  const submitText=editing?'保存修改':'保存到后台';
  sheetBody.innerHTML=`<form id="recordForm"><div class="form-grid">${fields.map(fieldHtml).join('')}</div><div class="sheet-actions"><button type="button" class="secondary" data-close-sheet>取消</button><button type="submit" class="primary">${submitText}</button></div></form>`;
  $('#recordForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const submit=form.querySelector('[type="submit"]');submit.disabled=true;submit.textContent='保存中...';try{const payload=Object.fromEntries(new FormData(form).entries());const file=form.querySelector('input[type="file"]')?.files?.[0];delete payload.icon_file;if(file)payload.icon=await uploadImage(file);if(editing&&payload.icon==='')delete payload.icon;await api(editing?`${config.endpoint}/${record.id}`:config.endpoint,{method:editing?'PUT':'POST',body:JSON.stringify(payload)});closeSheet();toast(editing?'修改已保存':'保存成功');await loadAll()}catch(error){toast(error.message,true);submit.disabled=false;submit.textContent=submitText}});
 }
 $('#sheetMask').classList.add('open');
}

  }catch(error){toast(error.message,true)}
 });
 $('#assignSubmit').addEventListener('click',async()=>{
  if(!target){toast('请先搜索并选择要修改的账号',true);return}
  const role=getRole();
  const label=(ALL_ROLES.find(r=>r.value===role)||{}).label||role;
  if(!window.confirm('职位分配提醒：确定把「'+target.username+'」的职务改为「'+label+'」吗？对方重新登录后生效。'))return;
  try{await api('/api/admin/users/'+target.id+'/role',{method:'PUT',body:JSON.stringify({role})});toast('角色已更新，对方重新登录后生效');await loadUsers()}
  catch(error){toast(error.message,true)}
 });
 loadUsers();
}
async function loadUsers(){
 try{
  const users=await api('/api/admin/users');
  $('#userList').innerHTML=users.map(u=>{
   const chips=ALL_ROLES.map(r=>`<div class="role-option${u.role===r.value?' active':''}" data-set-role="${u.id}:${r.value}">${r.label}</div>`).join('');
   return `<div style="padding:10px 0;border-bottom:1px solid #eef2ef">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
     <div><b style="font-size:11px">${esc(u.username)}${state.user&&u.id===state.user.id?'（我）':''}</b><p style="font-size:9px;color:var(--muted);margin:3px 0 0">${esc(u.display_name||'未填称呼')} · 当前：${esc(u.role_label||u.role)}</p></div>
     <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <span class="badge" data-edit-role="${u.id}" style="cursor:pointer" title="点击修改职务">${esc(u.role_label||u.role)}</span>
      <button class="action-link" data-reset-pw="${u.id}" style="font-size:12px;padding:4px 8px">重置密码</button>
     </div>
    </div>
    <div class="role-options" id="roleEdit_${u.id}" style="display:none;margin-top:10px">${chips}</div>
    <div id="pwReset_${u.id}" style="display:none;margin-top:10px">
     <div style="display:flex;gap:8px">
      <input id="newpwd_${u.id}" type="password" placeholder="新密码（至少 6 位）" style="flex:1">
      <button class="primary" data-reset-confirm="${u.id}" style="height:42px;padding:0 12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--g700),var(--g800));color:#fff;font-size:11px;font-weight:800;flex:0 0 auto;cursor:pointer">确认重置</button>
     </div>
     <span class="field-hint">密码是加密保存的，任何人都看不到原密码；重置后原密码立即失效，请把新密码告知对方。</span>
    </div>
   </div>`
  }).join('');
 }catch(error){$('#userList').innerHTML=`<div class="notice">${esc(error.message)}</div>`}
}
function openAdminLogin(){
 $('#sheetTitle').textContent='管理员登录 · 分配职务';
 $('#sheetDesc').textContent='分配职务需要平台管理员身份：输入管理员的账号与密码，验证通过后自动切换登录并打开账号管理。当前登录会被替换。';
 $('#sheetBody').innerHTML=`
  <div class="field"><label>管理员账号</label><input id="adminUser" placeholder="例如：demo"></div>
  <div class="field"><label>管理员密码</label><div class="pwd-wrap"><input id="adminPwd" type="password" placeholder="至少 6 位"><button type="button" class="pwd-toggle" data-pwd="adminPwd" aria-label="显示或隐藏密码">${EYE_CLOSED}</button></div></div>
  <div class="notice">还没有管理员？在电脑上进入「后台」目录执行：npm run make:admin -- 账号。自助注册的账号不是管理员。</div>
  <div class="sheet-actions"><button class="secondary" data-close-sheet>取消</button><button class="primary" id="adminLoginSubmit">登录并分配</button></div>`;
 $('#sheetMask').classList.add('open');
 $('#adminLoginSubmit').addEventListener('click',async()=>{
  const username=$('#adminUser').value.trim(),password=$('#adminPwd').value;
  if(!username||!password){toast('请填写管理员账号和密码',true);return}
  try{
   const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});
   if(data.user.role!=='admin'){toast('该账号是「'+(data.user.role_label||data.user.role)+'」，不是平台管理员',true);return}
   saveAuth(data);closeSheet();toast('已切换为管理员账号');await loadAll();openUserManage();
  }catch(error){toast(error.message,true)}
 });
}
function renderLogin(mode='login'){
  state.page='login';
  document.body.classList.add('on-login');
  $('#navTitle').textContent=mode==='login'?'账号登录':'注册账号';
  $('#navSub').textContent='每个账号的数据独立保存';
  $('#app').innerHTML=`<section class="page active">
  <div class="hero" style="min-height:auto"><small>GU SHI CLOUD · 数据可保存</small><h1>登录后<em>数据只属于你的账号</em></h1><p>基地、批次、环境、溯源、供应和采购记录都保存在后台数据库，服务重启不会丢失，其他账号看不到。</p></div>
  <div class="card" style="padding:16px;margin-top:14px">
    <div style="font-size:15px;font-weight:900">${mode==='login'?'账号登录':'注册新账号'}</div>
    <p style="font-size:9px;color:var(--muted);margin:6px 0 14px">${mode==='login'?'还没有账号？点击下方“注册新账号”。':'注册成功后自动登录，数据只保存在这个账号下。'}</p>
    <form id="authForm" class="form-grid">
      <div class="field full"><label>账号</label><input name="username" autocomplete="username" placeholder="3-32 位字母、数字、下划线或中文"></div>
      <div class="field full"><label>密码</label><div class="pwd-wrap"><input type="password" name="password" id="authPwd" autocomplete="current-password" placeholder="至少 6 位"><button type="button" class="pwd-toggle" data-pwd="authPwd" aria-label="显示或隐藏密码">${EYE_CLOSED}</button></div></div>
      ${mode==='register'?'<div class="field full"><label>称呼（可选）</label><input name="display_name" placeholder="例如：王师傅 / 德安基地"></div>':''}
      ${mode==='register'?`<div class="field full"><label>注册身份（点选）</label><div class="role-options" id="registerRoles">${REGISTER_ROLES.map((r,i)=>`<div class="role-option${i===0?' active':''}" data-role-index="${i}">${r.label}</div>`).join('')}</div><span class="field-hint" id="registerRoleDesc">${REGISTER_ROLES[0].desc}</span><span class="field-hint">「政府/服务机构」「专家」「平台管理员」不可自选，注册后由平台管理员分配</span></div>`:''}
    </form>
    <button class="primary full" id="authSubmit">${mode==='login'?'登录':'注册并登录'}</button>
    <div class="sheet-actions"><button class="secondary" id="authSwitch">${mode==='login'?'注册新账号':'返回登录'}</button></div>
  </div></section>`;
  let registerIdx=0;
  if(mode==='register'){$$('#registerRoles .role-option').forEach(chip=>chip.addEventListener('click',()=>{registerIdx=Number(chip.dataset.roleIndex);$$('#registerRoles .role-option').forEach(c=>c.classList.toggle('active',c===chip));$('#registerRoleDesc').textContent=REGISTER_ROLES[registerIdx].desc}))}
  $('#authSwitch').addEventListener('click',()=>renderLogin(mode==='login'?'register':'login'));
  $('#authSubmit').addEventListener('click',async()=>{
    const payload=Object.fromEntries(new FormData($('#authForm')).entries());
    if(mode==='register')payload.role=REGISTER_ROLES[registerIdx].value;
    if(!payload.username||!payload.password){toast('请填写账号和密码',true);return}
    const button=$('#authSubmit');button.disabled=true;button.textContent='提交中...';
    try{
      const data=await api(mode==='login'?'/api/auth/login':'/api/auth/register',{method:'POST',body:JSON.stringify(payload)});
      saveAuth(data);toast(mode==='login'?'登录成功':'注册成功');await loadAll();
    }catch(error){toast(error.message,true);button.disabled=false;button.textContent=mode==='login'?'登录':'注册并登录'}
  });
}
function openAccount(){
  $('#sheetTitle').textContent='当前账号';
  $('#sheetDesc').textContent=state.user?`${state.user.display_name||state.user.username}（${state.user.username}）`:'未登录';
  $('#sheetBody').innerHTML=`<div class="notice success">该账号的基地、批次、环境、溯源、供应和采购记录都保存在后台 SQLite 数据库（server/data/gushi.sqlite），服务重启不会丢失，其他账号看不到。</div><div class="sheet-actions"><button class="secondary" data-close-sheet>关闭</button><button class="primary" data-logout>退出登录</button></div>`;
  $('#sheetMask').classList.add('open');
}
document.addEventListener('click',async event=>{
  if(event.target.closest('#accountButton')){openAccount();return}
  if(event.target.closest('[data-logout]')){
    try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch(error){}
    clearAuth();closeSheet();renderLogin();toast('已退出登录');
  }
});
if(state.token){loadAll()}else{renderLogin()}
</script>
</body>
</html>
